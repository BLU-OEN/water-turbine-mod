<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minecraft model preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#171717;font:13px/1.5 system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:14px}h1{font-size:16px;font-weight:600;margin:0}header p{margin:2px 0 0;color:#666;font-size:12px}a{color:inherit;text-underline-offset:3px}.viewport{position:relative;height:min(72vh,760px);min-height:380px;background:#e8e8e8;border:1px solid #ddd;border-radius:5px;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}.caption{position:absolute;top:14px;left:16px;color:#555;font-size:12px;pointer-events:none}.error{position:absolute;inset:40% 10%;display:none;background:#fff;padding:16px}.toolbar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:14px 0}.segment{display:flex;gap:4px}button{font:inherit;cursor:pointer;padding:6px 10px;border:1px solid #ccc;border-radius:4px;background:#fff;color:#222}button[aria-pressed=true]{color:#fff;background:#222;border-color:#222}button:hover{border-color:#777}label{display:flex;align-items:center;gap:8px;color:#555}input{accent-color:#222;width:110px}.hint{color:#666;font-size:12px;margin:0}.download{font-size:12px;white-space:nowrap}button:focus-visible,a:focus-visible,canvas:focus-visible,input:focus-visible{outline:2px solid #555;outline-offset:3px}@media(max-width:600px){main{padding:12px}.viewport{height:60vh;min-height:320px}.toolbar{gap:12px}header{align-items:flex-start}h1{font-size:15px}.download{font-size:11px}}
</style>
</head>
<body><main>
<header><div><h1 id="title"></h1><p>Black &amp; white · Minecraft 1.21.1</p></div><a class="download" id="download">Download resource pack</a></header>
<div class="viewport"><canvas id="model" tabindex="0" aria-label="3D model. Drag or use arrow keys to rotate. Scroll or use plus and minus to zoom."></canvas><span class="caption" id="view-caption"></span><div class="error" role="status" id="error">WebGL is unavailable in this browser. You can still download the resource pack above.</div></div>
<div class="toolbar" aria-label="Model controls">
<div class="segment" role="group" aria-label="Model version"><button id="mode-a" type="button" aria-pressed="true"></button><button id="mode-b" type="button" aria-pressed="false"></button></div>
<div class="segment" role="group" aria-label="Camera view"><button id="angle" type="button" aria-pressed="true">Reset view</button><button id="front" type="button" aria-pressed="false">Front</button><button id="back" type="button" aria-pressed="false">Rear</button></div>
<label for="zoom">Zoom <input id="zoom" type="range" min="0.65" max="1.65" step="0.05" value="1"></label>
</div><p class="hint">Drag to rotate · Scroll to zoom · Arrow keys also work</p>
</main>
<script>
const D=/*__DESIGN_DATA__*/;
const T=D.kind==='turbine', $=id=>document.getElementById(id);
document.title=`Redesign for ${D.kind} — Black & white`;
$('title').textContent=T?'Water turbine':'Rebreather goggles';
$('mode-a').textContent=T?'Waterlogged':'3D item';$('mode-b').textContent=T?'Dry':'Worn mask';
$('view-caption').textContent=T?'Waterlogged · Rotor running':'3D inventory & hand model';
$('download').href=D.download;$('download').download=`redesign-for-${D.kind}.zip`;
const canvas=$('model'),gl=canvas.getContext('webgl',{alpha:true,antialias:true,preserveDrawingBuffer:true});
if(!gl){$('error').style.display='block';}else start();
function start(){
 const vs=`attribute vec3 p;attribute vec2 uv;attribute float light;uniform float yaw;uniform float pitch;uniform float zoom;uniform float aspect;varying vec2 v;varying float l;void main(){vec3 q=p-vec3(8.0);q=vec3(cos(yaw)*q.x+sin(yaw)*q.z,q.y,-sin(yaw)*q.x+cos(yaw)*q.z);q=vec3(q.x,cos(pitch)*q.y-sin(pitch)*q.z,sin(pitch)*q.y+cos(pitch)*q.z);gl_Position=vec4(q.x*zoom/(15.0*aspect),q.y*zoom/15.0,q.z/100.0,1.0);v=uv;l=light;}`;
 const fs=`precision mediump float;uniform sampler2D tex;uniform float rows;uniform float frame;varying vec2 v;varying float l;void main(){vec4 c=texture2D(tex,vec2(v.x,(v.y+frame)/rows));if(c.a<0.1)discard;gl_FragColor=vec4(c.rgb*l,c.a);}`;
 function shader(type,s){const sh=gl.createShader(type);gl.shaderSource(sh,s);gl.compileShader(sh);if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(sh));return sh;}
 const program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vs));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);
 const uniforms=Object.fromEntries(['yaw','pitch','zoom','aspect','rows','frame'].map(n=>[n,gl.getUniformLocation(program,n)]));
 const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);
 for(const [n,size,offset] of [['p',3,0],['uv',2,12],['light',1,20]]){const loc=gl.getAttribLocation(program,n);gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,size,gl.FLOAT,false,24,offset);}
 gl.enable(gl.DEPTH_TEST);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
 const textures={};
 function texture(name,data){const tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);if(data.p)gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,data.w,data.h,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array(data.p));else gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,data);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);textures[name]=tex;}
 for(const [name,data] of Object.entries(D.textures)){if(data.url){const im=new Image();im.onload=()=>texture(name,im);im.src=data.url;}else texture(name,data);}
 let yaw=-.65,pitch=-.38,zoom=1,mode=0,drag=null,lastDrawKey=null;
 const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
 const faces=['north','south','east','west','up','down'];
 const defaultFace=mat=>({uv:D.tiles[mat],texture:'#materials'});
 function box(from,to,mat,overrides={}){return {from,to,faces:Object.assign(Object.fromEntries(faces.map(f=>[f,defaultFace(mat)])),overrides)};}
 function worn(){return [
  box([0,0,0],[16,16,16],'hair',{north:defaultFace('skin')}),
  box([4,-3,4],[12,0,12],'dark'),
  {from:[-1,-1,-1],to:[17,17,17],faces:Object.fromEntries(Object.entries({north:[16,16,32,32],south:[48,16,64,32],west:[0,16,16,32],east:[32,16,48,32],up:[16,0,32,16],down:[32,0,48,16]}).map(([f,uv])=>[f,{uv:[uv[0]/8,uv[1]/4,uv[2]/8,uv[3]/4],texture:'#armor'}]))}
 ];}
 function mesh(es){const out={};for(const e of es){const a=e.from,b=e.to;
  const [x,y,z]=a,[X,Y,Z]=b;
  const corners={north:[[x,Y,z],[X,Y,z],[X,y,z],[x,y,z]],south:[[X,Y,Z],[x,Y,Z],[x,y,Z],[X,y,Z]],east:[[X,Y,z],[X,Y,Z],[X,y,Z],[X,y,z]],west:[[x,Y,Z],[x,Y,z],[x,y,z],[x,y,Z]],up:[[x,Y,Z],[X,Y,Z],[X,Y,z],[x,Y,z]],down:[[x,y,z],[X,y,z],[X,y,Z],[x,y,Z]]};
  for(const [side,f] of Object.entries(e.faces)){const name=f.texture.slice(1),p=corners[side],u=f.uv.map(v=>v/16),uv=[[u[0],u[1]],[u[2],u[1]],[u[2],u[3]],[u[0],u[3]]],light=({north:.95,south:.76,east:.80,west:.88,up:1,down:.62})[side];out[name]??=[];for(const i of [0,1,2,0,2,3])out[name].push(...p[i],...uv[i],light);}}
  return Object.fromEntries(Object.entries(out).map(([k,v])=>[k,new Float32Array(v)]));
 }
 let meshes=mesh(D.elements);
 function rebuild(){meshes=mesh(!T&&mode===1?worn():D.elements);}
 function modeSet(n){mode=n;$('mode-a').setAttribute('aria-pressed',n===0);$('mode-b').setAttribute('aria-pressed',n===1);$('view-caption').textContent=T?(n===0?'Waterlogged · Rotor running':'Dry · Rotor parked'):(n===0?'3D inventory & hand model':'Actual armor texture · Neutral mannequin');rebuild();}
 $('mode-a').onclick=()=>modeSet(0);$('mode-b').onclick=()=>modeSet(1);
 function view(id,y,p){yaw=y;pitch=p;for(const b of ['angle','front','back'])$(b).setAttribute('aria-pressed',b===id);}
 $('angle').onclick=()=>{view('angle',-.65,-.38);zoom=1;$('zoom').value=1;};$('front').onclick=()=>view('front',0,0);$('back').onclick=()=>view('back',Math.PI,0);
 $('zoom').oninput=()=>zoom=Number($('zoom').value);
 canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId);};
 canvas.onpointermove=e=>{if(!drag)return;yaw+=(e.clientX-drag[0])*.008;pitch=Math.max(-1.2,Math.min(1.2,pitch+(e.clientY-drag[1])*.008));drag=[e.clientX,e.clientY];};
 canvas.onpointerup=canvas.onpointercancel=()=>drag=null;
 canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.65,Math.min(1.65,zoom-e.deltaY*.001));$('zoom').value=zoom;},{passive:false});
 canvas.onkeydown=e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','+','-','='].includes(e.key)){e.preventDefault();if(e.key==='ArrowLeft')yaw-=.12;if(e.key==='ArrowRight')yaw+=.12;if(e.key==='ArrowUp')pitch=Math.min(1.2,pitch+.12);if(e.key==='ArrowDown')pitch=Math.max(-1.2,pitch-.12);if(e.key==='+'||e.key==='=')zoom=Math.min(1.65,zoom+.05);if(e.key==='-')zoom=Math.max(.65,zoom-.05);$('zoom').value=zoom;}};
 function draw(time){
  requestAnimationFrame(draw);
  const w=canvas.clientWidth,h=canvas.clientHeight,dpr=Math.min(devicePixelRatio||1,2);
  const frame=T&&mode===0&&!reduce?Math.floor(time/100)%16:0;
  const key=[w,h,dpr,yaw,pitch,zoom,mode,frame,Object.keys(textures).length].join(',');
  if(key===lastDrawKey)return;
  lastDrawKey=key;
  if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);}
  gl.viewport(0,0,canvas.width,canvas.height);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.uniform1f(uniforms.yaw,yaw);gl.uniform1f(uniforms.pitch,pitch);gl.uniform1f(uniforms.zoom,zoom*(w<h?w/h:1));gl.uniform1f(uniforms.aspect,w/h);
  for(const [name,vertices] of Object.entries(meshes)){if(!textures[name])continue;gl.bindTexture(gl.TEXTURE_2D,textures[name]);gl.uniform1f(uniforms.rows,name==='rotor'?16:1);gl.uniform1f(uniforms.frame,name==='rotor'?frame:0);gl.bufferData(gl.ARRAY_BUFFER,vertices,gl.STATIC_DRAW);gl.drawArrays(gl.TRIANGLES,0,vertices.length/6);}window.__previewReady=Object.keys(textures).length===Object.keys(D.textures).length;}
 requestAnimationFrame(draw);
}

</script></body></html>
